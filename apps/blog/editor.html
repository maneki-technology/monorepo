<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor — Kien Nguyen</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script>
    (function() {
      var t = localStorage.getItem('blog-theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }


    html, body, #admin-root {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Geist, sans-serif;
      color: var(--fd-text-primary, #27272a);
      background: var(--fd-surface-primary, #fff);
    }

    .admin-layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }



    .admin-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      position: relative;
      overflow: hidden;
    }

    .admin-tab-bar {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--fd-border-minimal, #e4e4e7);
      flex-shrink: 0;
      padding: 4px 8px 0;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .admin-tab-bar ui-tab-item {
      max-width: 180px;
    }

    .admin-tab-bar ui-tab-group {
      flex: 1;
      min-width: 0;
    }

    ui-tab-item {
      max-width: 180px;
    }

    .admin-tab-bar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      flex-shrink: 0;
    }
    .admin-editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .admin-form {
      padding: 12px;
      border-bottom: 1px solid var(--fd-border-minimal, #e4e4e7);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .admin-form-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .admin-form-row-group {
      display: flex;
      gap: var(--fd-space-2);
    }

    .admin-form-row-group .admin-form-row {
      flex: 1;
      min-width: 0;
    }

    .admin-form-row-group .admin-form-row:has(ui-datetime-picker) {
      flex: 0 0 auto;
      width: 200px;
    }

    .admin-form-row-group .admin-form-row:first-child {
      flex: 0 0 auto;
    }

    #admin-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    #admin-project-tech-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .admin-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--fd-border-minimal, #e4e4e7);
      flex-wrap: wrap;
    }

    .admin-toolbar button[data-action] {
      background: none;
      border: 1px solid var(--fd-border-minimal, #e4e4e7);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      color: var(--fd-text-secondary, #52525b);
      line-height: 1;
    }

    .admin-toolbar button[data-action]:hover {
      background: var(--fd-surface-secondary, #f4f4f5);
      color: var(--fd-text-primary, #27272a);
    }

    .admin-toolbar-spacer {
      flex: 1;
    }

    .admin-btn {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border: 1px solid var(--fd-border-minimal, #e4e4e7);
      border-radius: 4px;
      background: var(--fd-surface-primary, #fff);
      color: var(--fd-text-primary, #27272a);
      cursor: pointer;
    }

    .admin-btn:hover {
      background: var(--fd-surface-secondary, #f4f4f5);
    }

    .admin-btn-primary {
      background: var(--fd-text-link, #2680eb);
      color: #fff;
      border-color: var(--fd-text-link, #2680eb);
    }

    .admin-btn-primary:hover {
      opacity: 0.9;
    }

    .admin-btn-danger {
      color: var(--fd-status-text-error, #d91f11);
      border-color: var(--fd-status-text-error, #d91f11);
    }

    .admin-btn-danger:hover {
      background: var(--fd-status-text-error, #d91f11);
      color: #fff;
    }

    .admin-split {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .admin-textarea-wrap {
      border-right: 1px solid var(--fd-border-minimal, #e4e4e7);
    }

    .admin-split #admin-content {
      width: 100%;
      min-height: 100%;
      resize: none;
      border: none;
      padding: 16px;
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      background: var(--fd-surface-primary, #fff);
      color: var(--fd-text-primary, #27272a);
      outline: none;
      tab-size: 2;
      overflow: hidden;
      box-sizing: border-box;
      field-sizing: content;
      transition: background 0.15s ease;
    }

    .admin-split #admin-content.drag-over {
      background: var(--fd-surface-secondary, #f4f4f5);
    }

    .admin-textarea-spacer {
      height: 25vh;
    }

    .admin-preview {
      padding: 16px 24px;
      background: var(--fd-surface-primary, #fff);
    }

    .admin-split ui-scrollbar {
      flex: 1;
    }

    .admin-preview-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      flex-direction: column;
      background: var(--fd-surface-primary, #fff);
    }

    .admin-preview-overlay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--fd-border-minimal, #e4e4e7);
    }

    .admin-preview-overlay-content {
      flex: 1;
      overflow-y: auto;
    }

    /* ─── Post content preview ─── */

    .heading-02 { font-size: 32px; line-height: 40px; font-weight: 500; }
    .heading-05 { font-size: 16px; line-height: 24px; font-weight: 500; }
    .body-02 { font-size: 14px; line-height: 20px; font-weight: 400; }
    .text-secondary { color: var(--fd-text-secondary, #52525b); }
    .text-link { color: var(--fd-text-link, #2680eb); }
    .post-meta { font-size: 12px; line-height: 16px; color: var(--fd-text-secondary, #52525b); }
    .tags { display: flex; flex-wrap: wrap; gap: var(--fd-space-0-75, 6px); margin-top: var(--fd-space-1-5, 12px); }
    .mt-1 { margin-top: var(--fd-space-1, 8px); }
    .mt-2 { margin-top: var(--fd-space-2, 16px); }
    .mt-3 { margin-top: var(--fd-space-3, 24px); }
    .mt-4 { margin-top: var(--fd-space-4, 32px); }

    .post-content h2 { font-size: 24px; line-height: 32px; font-weight: 500; margin: 48px 0 16px; }
    .post-content h3 { font-size: 20px; line-height: 28px; font-weight: 500; margin: 32px 0 12px; }
    .post-content h4 { font-size: 16px; line-height: 24px; font-weight: 500; margin: 24px 0 8px; }
    .post-content p { font-size: 16px; line-height: 24px; margin: 0 0 16px; }
    .post-content ul, .post-content ol { font-size: 16px; line-height: 24px; margin: 0 0 16px; padding-left: 24px; }
    .post-content li { margin-bottom: 4px; }
    .post-content pre {
      border: 1px solid var(--fd-border-minimal, #e4e4e7);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 0 0 16px;
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      line-height: 20px;
      background: var(--fd-surface-secondary, #f4f4f5);
    }
    .post-content code {
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      background: var(--fd-surface-secondary, #f4f4f5);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .post-content pre code { background: none; padding: 0; border-radius: 0; }

    /* Blog content images — natural sizing, no background */
    .post-content ui-image {
      --ui-image-bg: transparent;
      --ui-image-fit: contain;
      display: block;
      max-width: 100%;
      margin: var(--fd-space-2) 0;
    }

    /* Shiki dual-theme support */
    .post-content pre.shiki,
    .post-content pre.shiki span {
      color: var(--shiki-light);
      background-color: var(--shiki-light-bg);
    }
    [data-theme="dark"] .post-content pre.shiki,
    [data-theme="dark"] .post-content pre.shiki span {
      color: var(--shiki-dark);
      background-color: var(--shiki-dark-bg);
    }
    .post-content blockquote {
      border-left: 3px solid var(--fd-border-moderate, #a1a1aa);
      padding-left: 16px;
      margin: 0 0 16px;
      color: var(--fd-text-secondary, #52525b);
      font-style: italic;
    }
    .admin-loading {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .admin-loading-icon {
      width: 80px;
      height: 80px;
      animation: loading-bounce 1s ease-in-out infinite;
      border-radius: 50%;
    }

    [data-theme="dark"] .admin-loading-icon {
      filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.4)) drop-shadow(0 0 40px rgba(255, 255, 255, 0.15));
    }

    @keyframes loading-bounce {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.7; }
      50% { transform: translateY(-12px) scale(1.1); opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .admin-bulk-actions {
      display: flex;
      align-items: center;
      gap: var(--fd-space-0-75);
      padding: var(--fd-space-1) var(--fd-space-1-5);
      border-top: var(--fd-border-width-sm) solid var(--fd-border-minimal);
      background: var(--fd-surface-secondary);
      flex-shrink: 0;
    }

    .admin-bulk-count {
      font-family: var(--fd-type-body-03-font-family);
      font-size: var(--fd-type-body-03-font-size);
      line-height: var(--fd-type-body-03-line-height);
      color: var(--fd-text-secondary);
      margin-right: auto;
    }

    /* Image gallery panel */
    #admin-gallery {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      z-index: 10;
      --ui-sp-width: 320px;
      --ui-sp-bg: var(--fd-surface-primary);
    }

    .admin-gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--fd-space-1) var(--fd-space-1-5);
      border-bottom: var(--fd-border-width-sm) solid var(--fd-border-minimal);
      flex-shrink: 0;
    }

    .admin-gallery-grid {
      flex: 1;
      overflow-y: auto;
      padding: var(--fd-space-1);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--fd-space-1);
      align-content: start;
    }

    .gallery-item {
      display: flex;
      flex-direction: column;
      border: var(--fd-border-width-sm) solid var(--fd-border-minimal);
      border-radius: var(--fd-radius-sm);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .gallery-item:hover {
      border-color: var(--fd-border-moderate);
    }

    .gallery-item img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      background: var(--fd-surface-secondary);
    }

    .gallery-item-info {
      padding: var(--fd-space-0-5);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .gallery-item-name {
      font-family: var(--fd-type-body-03-font-family);
      font-size: var(--fd-type-body-03-font-size);
      color: var(--fd-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gallery-item-size {
      font-family: var(--fd-type-body-03-font-family);
      font-size: 10px;
      color: var(--fd-text-secondary);
    }

    .gallery-item-actions {
      display: flex;
      gap: var(--fd-space-0-5);
      padding: var(--fd-space-0-5);
      border-top: var(--fd-border-width-sm) solid var(--fd-border-minimal);
    }

    .gallery-loading,
    .gallery-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: var(--fd-space-3);
      font-family: var(--fd-type-body-02-font-family);
      font-size: var(--fd-type-body-02-font-size);
      color: var(--fd-text-secondary);
    }

    /* Circular context menu */
    .context-ring {
      position: fixed;
      z-index: 100;
      width: 0;
      height: 0;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.3);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .context-ring.open {
      pointer-events: auto;
      opacity: 1;
      transform: scale(1);
    }

    .context-ring-btn {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: var(--fd-border-width-sm) solid var(--fd-border-minimal);
      background: var(--fd-surface-primary);
      color: var(--fd-text-primary);
      font-size: 11px;
      font-weight: 600;
      font-family: var(--fd-type-body-03-font-family);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: -14px;
      margin-top: -14px;
      transition: background 0.1s ease, border-color 0.1s ease, box-shadow 0.1s ease;
      box-shadow: var(--fd-elevation-01);
    }

    .context-ring-btn:hover {
      background: var(--fd-surface-secondary);
      border-color: var(--fd-border-moderate);
      box-shadow: var(--fd-elevation-02);
    }

    .context-ring-btn:active {
      transform: translate(var(--tw-translate-x, 0), var(--tw-translate-y, 0)) scale(0.9);
    }

    /* Project preview sortable grid */
    .project-preview-sortable {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--fd-space-2);
    }

    .project-preview-card {
      border: var(--fd-border-width-sm) solid var(--fd-border-minimal);
      border-radius: var(--fd-radius-md);
      padding: var(--fd-space-2);
      background: var(--fd-surface-primary);
      cursor: grab;
      transition: box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .project-preview-card:hover {
      box-shadow: var(--fd-elevation-02);
    }

    .project-preview-card.dragging {
      opacity: 0.4;
    }

    .project-preview-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--fd-space-0-5);
    }

    .project-preview-card-status {
      margin-top: var(--fd-space-1);
    }

    /* Project image field */
    .project-image-thumb {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      width: 200px;
    }

    .project-image-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--fd-space-0-5);
      background: rgba(0, 0, 0, 0.5);
      border-radius: var(--fd-radius-sm);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .project-image-thumb:hover .project-image-overlay {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="editor-root"></div>
  <script type="module" src="/src/editor-entry.ts"></script>
</body>
</html>
