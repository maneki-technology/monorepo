<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor — Kien Nguyen</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script>
    (function() {
      var t = localStorage.getItem('blog-theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  <link rel="preload" href="/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }

    @font-face {
      font-family: 'Geist';
      src: url('/Geist-Variable.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    html, body, #admin-root {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Geist, sans-serif;
      color: var(--fd-text-primary, #27272a);
      background: var(--fd-surface-primary, #fff);
    }

    .admin-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .admin-tab-bar {
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--fd-border-minimal, #e4e4e7);
      flex-shrink: 0;
      padding: 4px 8px 0;
    }

    .admin-tab-bar ui-tab-group {
      flex: 1;
      min-width: 0;
    }

    .admin-tab-bar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      flex-shrink: 0;
    }
    .admin-editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .admin-form {
      padding: 12px;
      border-bottom: 1px solid var(--fd-border-minimal, #e4e4e7);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .admin-form-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .admin-form-row-group {
      display: flex;
      gap: 12px;
    }

    .admin-form-row-group .admin-form-row {
      flex: 1;
      min-width: 0;
    }

    .admin-form-row-group .admin-form-row:has(ui-datetime-picker) {
      flex: 0 0 auto;
      width: 200px;
    }

    .admin-form-row-group .admin-form-row:first-child {
      flex: 0 0 auto;
    }

    #admin-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .admin-toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--fd-border-minimal, #e4e4e7);
      flex-wrap: wrap;
    }

    .admin-toolbar button[data-action] {
      background: none;
      border: 1px solid var(--fd-border-minimal, #e4e4e7);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      color: var(--fd-text-secondary, #52525b);
      line-height: 1;
    }

    .admin-toolbar button[data-action]:hover {
      background: var(--fd-surface-secondary, #f4f4f5);
      color: var(--fd-text-primary, #27272a);
    }

    .admin-toolbar-spacer {
      flex: 1;
    }

    .admin-btn {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border: 1px solid var(--fd-border-minimal, #e4e4e7);
      border-radius: 4px;
      background: var(--fd-surface-primary, #fff);
      color: var(--fd-text-primary, #27272a);
      cursor: pointer;
    }

    .admin-btn:hover {
      background: var(--fd-surface-secondary, #f4f4f5);
    }

    .admin-btn-primary {
      background: var(--fd-text-link, #2680eb);
      color: #fff;
      border-color: var(--fd-text-link, #2680eb);
    }

    .admin-btn-primary:hover {
      opacity: 0.9;
    }

    .admin-btn-danger {
      color: var(--fd-status-text-error, #d91f11);
      border-color: var(--fd-status-text-error, #d91f11);
    }

    .admin-btn-danger:hover {
      background: var(--fd-status-text-error, #d91f11);
      color: #fff;
    }

    .admin-split {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .admin-split #admin-content {
      flex: 1;
      resize: none;
      border: none;
      border-right: 1px solid var(--fd-border-minimal, #e4e4e7);
      padding: 16px;
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      background: var(--fd-surface-primary, #fff);
      color: var(--fd-text-primary, #27272a);
      outline: none;
      tab-size: 2;
    }

    .admin-preview {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
      background: var(--fd-surface-primary, #fff);
    }

    .admin-preview-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      flex-direction: column;
      background: var(--fd-surface-primary, #fff);
    }

    .admin-preview-overlay-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--fd-border-minimal, #e4e4e7);
    }

    .admin-preview-overlay-content {
      flex: 1;
      overflow-y: auto;
    }

    /* ─── Post content preview ─── */

    .heading-02 { font-size: 32px; line-height: 40px; font-weight: 500; }
    .heading-05 { font-size: 16px; line-height: 24px; font-weight: 500; }
    .body-02 { font-size: 14px; line-height: 20px; font-weight: 400; }
    .text-secondary { color: var(--fd-text-secondary, #52525b); }
    .text-link { color: var(--fd-text-link, #2680eb); }
    .post-meta { font-size: 12px; line-height: 16px; color: var(--fd-text-secondary, #52525b); }
    .tags { display: flex; flex-wrap: wrap; gap: var(--fd-space-0-75, 6px); margin-top: var(--fd-space-1-5, 12px); }
    .mt-1 { margin-top: var(--fd-space-1, 8px); }
    .mt-2 { margin-top: var(--fd-space-2, 16px); }
    .mt-3 { margin-top: var(--fd-space-3, 24px); }
    .mt-4 { margin-top: var(--fd-space-4, 32px); }

    .post-content h2 { font-size: 24px; line-height: 32px; font-weight: 500; margin: 48px 0 16px; }
    .post-content h3 { font-size: 20px; line-height: 28px; font-weight: 500; margin: 32px 0 12px; }
    .post-content h4 { font-size: 16px; line-height: 24px; font-weight: 500; margin: 24px 0 8px; }
    .post-content p { font-size: 16px; line-height: 24px; margin: 0 0 16px; }
    .post-content ul, .post-content ol { font-size: 16px; line-height: 24px; margin: 0 0 16px; padding-left: 24px; }
    .post-content li { margin-bottom: 4px; }
    .post-content pre {
      border: 1px solid var(--fd-border-minimal, #e4e4e7);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 0 0 16px;
      font-family: 'Roboto Mono', monospace;
      font-size: 14px;
      line-height: 20px;
      background: var(--fd-surface-secondary, #f4f4f5);
    }
    .post-content code {
      font-family: 'Roboto Mono', monospace;
      font-size: 13px;
      background: var(--fd-surface-secondary, #f4f4f5);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .post-content pre code { background: none; padding: 0; border-radius: 0; }
    .post-content blockquote {
      border-left: 3px solid var(--fd-border-moderate, #a1a1aa);
      padding-left: 16px;
      margin: 0 0 16px;
      color: var(--fd-text-secondary, #52525b);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="editor-root"></div>
  <script type="module" src="/src/editor-entry.ts"></script>
</body>
</html>
