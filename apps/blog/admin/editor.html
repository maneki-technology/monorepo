<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor — Kien Nguyen</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        var m = document.cookie.match(/admin-theme=(light|dark)/);
        if (m && m[1] === "dark") document.documentElement.setAttribute("data-theme", "heroui-dark");
      })();
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body,
      #admin-root {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: Geist, sans-serif;
        color: var(--fd-text-primary, #27272a);
        background: var(--fd-surface-secondary, #fff);
      }

      editor-page {
        display: block;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="admin-root"></div>
    <script type="module" src="/src/admin/editor-entry.ts"></script>
  </body>
</html>
