<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog</title>
  <meta name="description" content="Personal blog and portfolio — fullstack development, design systems, and more." />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="alternate" type="application/rss+xml" title="Kien Nguyen's blog" href="/feed.xml" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c2b36" media="(prefers-color-scheme: dark)" />

  <!-- Open Graph defaults (overridden per-page by JS) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Kien Nguyen's blog" />
  <meta property="og:title" content="Blog — Kien Nguyen" />
  <meta property="og:description" content="Personal blog and portfolio — fullstack development, design systems, and more." />
  <meta property="og:url" content="https://kien.maneki.tech/" />
  <meta name="twitter:card" content="summary" />
  <!-- Prevent dark mode flash: apply theme before any rendering -->
  <script>
    (function() {
      var t = localStorage.getItem('blog-theme');
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'heroui-dark');
      else document.documentElement.setAttribute('data-theme', 'heroui');
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }

    /* Prevent FOUC — hide Web Components until JS registers them */
    ui-badge:not(:defined),
    ui-card:not(:defined),
    ui-link:not(:defined),
    ui-image:not(:defined),
    ui-search:not(:defined),
    ui-progress-bar:not(:defined) {
      opacity: 0;
    }


    @font-face {
      font-family: 'Geist Fallback';
      src: local('Arial');
      size-adjust: 100.5%;
      ascent-override: 99%;
      descent-override: 22%;
      line-gap-override: 0%;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Geist, 'Geist Fallback', sans-serif;
      color: var(--fd-text-primary);
      background: var(--fd-surface-primary);
      scrollbar-width: none;
    }

    [data-theme="heroui"] #app {
      background: var(--fd-surface-secondary);
    }

    /* Dark mode: search input shares surface-primary bg — elevate to tertiary for separation */
    [data-theme="heroui-dark"] ui-search {
      --ui-search-bg: var(--fd-surface-tertiary);
      --ui-search-border: var(--fd-border-minimal);
    }

    body::-webkit-scrollbar {
      display: none;
    }

    /* ─── Layout shell ─── */

    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ─── Header ─── */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: var(--fd-space-3) var(--fd-space-3) 0;
    }

    .site-name {
      font-size: 16px;
      font-weight: 500;
      color: var(--fd-text-primary, #27272a);
      text-decoration: none;
    }

    .site-name:hover {
      color: var(--fd-text-link, #2680eb);
    }

    nav {
      display: flex;
      align-items: center;
      gap: var(--fd-space-3);
    }

    nav a {
      font-size: 14px;
      color: var(--fd-text-secondary, #52525b);
      text-decoration: none;
      font-weight: 400;
    }

    nav a:hover {
      color: var(--fd-text-primary, #27272a);
    }

    nav a.active {
      color: var(--fd-text-primary, #27272a);
      font-weight: 500;
    }
    #theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      color: var(--fd-text-secondary, #52525b);
      line-height: 1;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── Content ─── */

    main {
      flex: 1;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: var(--fd-space-6) var(--fd-space-3);
    }

    /* ─── Footer ─── */

    footer {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: var(--fd-space-3);
      border-top: 1px solid var(--fd-border-minimal, #e4e4e7);
      font-size: 12px;
      color: var(--fd-text-secondary, #52525b);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer ui-link {
      --ui-link-color: var(--fd-text-secondary, #52525b);
      --ui-link-hover-color: var(--fd-text-primary, #27272a);
      --ui-link-visited-color: var(--fd-text-secondary, #52525b);
    }


    /* ─── Typography ─── */

    .display-03 { font-size: var(--fd-type-display-03-font-size); line-height: var(--fd-type-display-03-line-height); font-weight: var(--fd-type-display-03-font-weight); }
    .heading-02 { font-size: var(--fd-type-heading-02-font-size); line-height: var(--fd-type-heading-02-line-height); font-weight: var(--fd-type-heading-02-font-weight); }
    .heading-03 { font-size: var(--fd-type-heading-03-font-size); line-height: var(--fd-type-heading-03-line-height); font-weight: var(--fd-type-heading-03-font-weight); }
    .heading-04 { font-size: var(--fd-type-heading-04-font-size); line-height: var(--fd-type-heading-04-line-height); font-weight: var(--fd-type-heading-04-font-weight); }
    .heading-05 { font-size: var(--fd-type-heading-05-font-size); line-height: var(--fd-type-heading-05-line-height); font-weight: var(--fd-type-heading-05-font-weight); }
    .body-01 { font-size: var(--fd-type-body-01-font-size); line-height: var(--fd-type-body-01-line-height); font-weight: var(--fd-type-body-01-font-weight); }
    .body-02 { font-size: var(--fd-type-body-02-font-size); line-height: var(--fd-type-body-02-line-height); font-weight: var(--fd-type-body-02-font-weight); }
    .body-03 { font-size: var(--fd-type-body-03-font-size); line-height: var(--fd-type-body-03-line-height); font-weight: var(--fd-type-body-03-font-weight); }
    .caption { font-size: var(--fd-type-caption-01-font-size); line-height: var(--fd-type-caption-01-line-height); font-weight: var(--fd-type-caption-01-font-weight); }
    .code { font-family: 'Roboto Mono', monospace; font-size: var(--fd-type-code-01-font-size); line-height: var(--fd-type-code-01-line-height); }

    /* ─── Utilities ─── */

    .text-secondary { color: var(--fd-text-secondary, #52525b); }
    .text-tertiary { color: var(--fd-text-tertiary, #71717a); }
    .text-link { color: var(--fd-text-link, #2680eb); }

    .mt-1 { margin-top: var(--fd-space-1); }
    .mt-2 { margin-top: var(--fd-space-2); }
    .mt-3 { margin-top: var(--fd-space-3); }
    .mt-4 { margin-top: var(--fd-space-4); }
    .mt-6 { margin-top: var(--fd-space-6); }
    .mt-8 { margin-top: var(--fd-space-8); }
    .mt-10 { margin-top: var(--fd-space-10); }
    .mb-1 { margin-bottom: var(--fd-space-1); }
    .mb-2 { margin-bottom: var(--fd-space-2); }
    .mb-3 { margin-bottom: var(--fd-space-3); }
    .mb-4 { margin-bottom: var(--fd-space-4); }
    .mb-6 { margin-bottom: var(--fd-space-6); }

    .gap-1 { gap: var(--fd-space-1); }
    .gap-2 { gap: var(--fd-space-2); }
    .gap-3 { gap: var(--fd-space-3); }
    .gap-4 { gap: var(--fd-space-4); }
    .gap-6 { gap: var(--fd-space-6); }

    .stack { display: flex; flex-direction: column; }
    .row { display: flex; flex-wrap: wrap; }
    .items-center { align-items: center; }

    /* ─── Blog-specific ─── */

    .post-card {
      padding: var(--fd-space-3) 0;
      border-bottom: 1px solid var(--fd-border-minimal, #e4e4e7);
    }

    .post-card:first-child {
      padding-top: 0;
    }

    .post-card:last-child {
      border-bottom: none;
    }

    .post-card-title {
      font-size: var(--fd-type-heading-04-font-size);
      line-height: var(--fd-type-heading-04-line-height);
      font-weight: var(--fd-type-heading-04-font-weight);
      color: var(--fd-text-primary, #27272a);
      text-decoration: none;
      cursor: pointer;
    }

    .post-card-title:hover {
      color: var(--fd-text-link, #2680eb);
    }

    .post-meta {
      font-size: var(--fd-type-body-03-font-size);
      line-height: var(--fd-type-body-03-line-height);
      color: var(--fd-text-secondary, #52525b);
      margin-top: var(--fd-space-0-5);
    }

    .post-excerpt {
      font-size: var(--fd-type-body-02-font-size);
      line-height: var(--fd-type-body-02-line-height);
      color: var(--fd-text-secondary, #52525b);
      margin-top: var(--fd-space-1);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--fd-space-0-75);
      margin-top: var(--fd-space-1-5);
      margin-top: 12px;
    }

    /* ─── Post content ─── */

    .post-content h2 { font-size: var(--fd-type-heading-03-font-size); line-height: var(--fd-type-heading-03-line-height); font-weight: var(--fd-type-heading-03-font-weight); margin: var(--fd-space-6) 0 var(--fd-space-2); }
    .post-content h3 { font-size: var(--fd-type-heading-04-font-size); line-height: var(--fd-type-heading-04-line-height); font-weight: var(--fd-type-heading-04-font-weight); margin: var(--fd-space-4) 0 var(--fd-space-1-5); }
    .post-content h4 { font-size: var(--fd-type-heading-05-font-size); line-height: var(--fd-type-heading-05-line-height); font-weight: var(--fd-type-heading-05-font-weight); margin: var(--fd-space-3) 0 var(--fd-space-1); }
    .post-content p { font-size: var(--fd-type-body-01-font-size); line-height: var(--fd-type-body-01-line-height); margin: 0 0 var(--fd-space-2); }
    .post-content ul, .post-content ol { font-size: var(--fd-type-body-01-font-size); line-height: var(--fd-type-body-01-line-height); margin: 0 0 var(--fd-space-2); padding-left: var(--fd-space-3); }
    .post-content li { margin-bottom: var(--fd-space-0-5); }

    .post-content pre {
      border: 1px solid var(--fd-border-minimal, #e4e4e7);
      border-radius: var(--fd-radius-sm);
      padding: var(--fd-space-2);
      overflow-x: auto;
      margin: 0 0 var(--fd-space-2);
      font-family: 'Roboto Mono', monospace;
      font-size: var(--fd-type-code-01-font-size);
      line-height: var(--fd-type-code-01-line-height);
    }

    /* Shiki dual-theme: show light theme by default, dark when [data-theme="dark"] */
    .shiki { background-color: var(--shiki-light-bg); color: var(--shiki-light); }
    .shiki span { color: var(--shiki-light); }
    [data-theme="heroui-dark"] .shiki { background-color: var(--shiki-dark-bg); color: var(--shiki-dark, #e4e4e7); }
    [data-theme="heroui-dark"] .shiki span { color: var(--shiki-dark, #e4e4e7); }

    .post-content code {
      font-family: 'Roboto Mono', monospace;
      font-size: var(--fd-type-code-02-font-size);
      background: var(--fd-surface-secondary, #f4f4f5);
      padding: 2px 6px;
      border-radius: var(--fd-radius-sm);
    }

    .post-content pre code {
      background: none;
      padding: 0;
      border-radius: 0;
    }

    .post-content blockquote {
      border-left: 3px solid var(--fd-border-moderate, #a1a1aa);
      padding-left: var(--fd-space-2);
      margin: 0 0 var(--fd-space-2);
      color: var(--fd-text-secondary, #52525b);
      font-style: italic;
    }

    .post-content img {
      max-width: 100%;
      border-radius: var(--fd-radius-sm);
      margin: 0 0 var(--fd-space-2);
    }

    /* ─── Portfolio ─── */

    .project-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 600px) {
      .project-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .project-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 600px) {
      .project-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* ─── Reading Progress ─── */

    #reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      display: none;
    }

    body[data-show-progress] #reading-progress {
      display: block;
    }

    /* ─── Responsive ─── */

    @media (max-width: 600px) {
      header { padding: 16px 16px 0; }
      main { padding: 32px 16px; }
      footer { padding: 16px; }
      nav { gap: 16px; }
      .display-03 { font-size: var(--fd-type-heading-02-font-size); line-height: var(--fd-type-heading-02-line-height); }
    }
  </style>
</head>
<body>
  <ui-progress-bar id="reading-progress" size="m" label="none" value="0"></ui-progress-bar>
  <div id="app">
    <header>
      <a href="/" class="site-name">Kien Nguyen</a>
      <nav>
        <a href="/blog" data-route="blog">Blog</a>
        <a href="/portfolio" data-route="portfolio">Portfolio</a>
        <a href="/about" data-route="about">About</a>
        <button type="button" id="theme-toggle" aria-label="Toggle dark mode">☀️</button>
      </nav>
    </header>
    <main id="content">
      <section class="mb-6">
        <h1 class="display-03">Hey, I'm <strong>Kien Nguyen</strong></h1>
        <p class="body-01 text-secondary mt-2">Senior Software Engineer. Distributed systems, micro-frontends, and design systems.</p>
      </section>
    </main>
    <footer>
      <span>© 2026</span>
      <div style="display:flex;gap:16px;">
        <ui-link href="https://github.com/kiennt23" size="s" emphasis="subtle" external>GitHub</ui-link>
        <ui-link href="https://linkedin.com/in/kiennt23" size="s" emphasis="subtle" external>LinkedIn</ui-link>
      </div>
    </footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
