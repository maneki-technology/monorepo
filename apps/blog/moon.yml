$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'

dependsOn:
  - 'foundation'
  - 'ui-components'
  - 'grid-layout'

tasks:
  dev:
    command: 'vite --port 5175'
    deps:
      - '^:build'
    preset: 'server'

  build:
    script: 'vite build'
    inputs:
      - 'src/**/*'
      - 'index.html'
      - 'tsconfig.json'
      - 'vite.config.ts'
    outputs:
      - 'dist'
    deps:
      - '^:build'

  dev-pages:
    command: 'wrangler pages dev dist --compatibility-date 2024-12-01'
    deps:
      - '~:build'
    preset: 'server'
