$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"

dependsOn:
  - "foundation"
  - "ui-components"
  - "grid-layout"

tasks:
  dev:
    command: "vite --port 5175"
    deps:
      - "^:build"
    preset: "server"

  build:
    script: "npm run build"
    inputs:
      - "src/**/*"
      - "plugins/**/*"
      - "scripts/**/*"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.ts"
    outputs:
      - "dist"
    deps:
      - "^:build"

  test:
    command: "vitest --run src"
    inputs:
      - "src/**/*"
      - "vite.config.ts"

  typecheck:
    command: "tsc --noEmit"
    inputs:
      - "src/**/*"
      - "functions/**/*"
      - "plugins/**/*"
      - "scripts/**/*"
      - "vite.config.ts"
      - "tsconfig.json"
    deps:
      - "^:build"

  dev-pages:
    command: "wrangler pages dev dist --compatibility-date 2024-12-01"
    deps:
      - "~:build"
    preset: "server"
