$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'

dependsOn:
  - 'foundation'
  - 'ui-components'

tasks:
  dev:
    command: 'vite --port 5175'
    preset: 'server'

  build:
    script: 'vite build'
    inputs:
      - 'src/**/*'
      - 'index.html'
      - 'tsconfig.json'
      - 'vite.config.ts'
    outputs:
      - 'dist'
    deps:
      - '^:build'
