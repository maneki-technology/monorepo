name: DCTradingViewer
options:
  bundleIdPrefix: com.dctrading
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
settings:
  SWIFT_VERSION: "5.9"
targets:
  DCTradingViewer:
    type: application
    platform: [macOS, iOS]
    sources:
      - Sources/DCTradingViewer
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: tech.maneki.nekotrade
      PRODUCT_NAME: Neko Trade
      INFOPLIST_KEY_CFBundleDisplayName: Neko Trade
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DCTradingViewerAccountingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DCTradingViewerAccountingTests
    dependencies:
      - target: DCTradingViewer_macOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: tech.maneki.nekotrade.accounting-tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Neko Trade.app/Contents/MacOS/Neko Trade"
      BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DCTradingViewerAccountingTests:
    build:
      targets:
        DCTradingViewerAccountingTests: all
    test:
      targets:
        - DCTradingViewerAccountingTests
