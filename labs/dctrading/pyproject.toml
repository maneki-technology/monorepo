[project]
name = "dctrading"
version = "0.1.0"
description = "Directional Change + Reinforcement Learning trading system for crypto markets"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "torch>=2.0",
    "stable-baselines3>=2.3",
    "gymnasium>=1.0",
    "ccxt>=4.0",
    "vectorbt>=0.26",
    "hmmlearn>=0.3",
    "aiosqlite>=0.20",
    "mlflow>=2.0",
    "streamlit>=1.30",
    "prometheus-client>=0.20",
    "openai>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
