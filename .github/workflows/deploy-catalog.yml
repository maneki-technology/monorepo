name: Deploy Catalog

on:
  push:
    branches: [main]
    paths:
      - 'apps/catalog/**'
      - 'packages/ui-components/**'
      - 'packages/foundation/**'
      - 'packages/grid-layout/**'
      - 'packages/flex-layout/**'
      - 'packages/charts/**'
      - '.github/workflows/deploy-catalog.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/catalog/**'
      - 'packages/ui-components/**'
      - 'packages/foundation/**'
      - 'packages/grid-layout/**'
      - 'packages/flex-layout/**'
      - 'packages/charts/**'
      - '.github/workflows/deploy-catalog.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'

      - run: npm ci

      - name: Build foundation
        run: npm run build
        working-directory: packages/foundation

      - name: Build ui-components
        run: npm run build
        working-directory: packages/ui-components

      - name: Build grid-layout
        run: npm run build
        working-directory: packages/grid-layout

      - name: Build flex-layout
        run: npm run build
        working-directory: packages/flex-layout

      - name: Build charts
        run: npm run build
        working-directory: packages/charts

      - name: Build catalog
        run: npx vite build
        working-directory: apps/catalog

      - name: Create Cloudflare Pages project (if needed)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create maneki-catalog --production-branch=main

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/catalog/dist --project-name=maneki-catalog --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- catalog-preview -->';
            const body = `${marker}\n**Catalog preview:** ${process.env.URL}\n\nCommit: ${context.payload.pull_request.head.sha}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
