name: Deploy Blog

on:
  push:
    branches: [main]
    paths:
      - "apps/blog/**"
      - "packages/ui-components/**"
      - "packages/foundation/**"
      - "packages/grid-layout/**"
      - ".github/workflows/deploy-blog.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/blog/**"
      - "packages/ui-components/**"
      - "packages/foundation/**"
      - "packages/grid-layout/**"
      - ".github/workflows/deploy-blog.yml"
  repository_dispatch:
    types: [deploy-blog]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: "npm"

      - run: npm ci

      - name: Build foundation
        run: npm run build
        working-directory: packages/foundation

      - name: Build ui-components
        run: npm run build
        working-directory: packages/ui-components

      - name: Build grid-layout
        run: npm run build
        working-directory: packages/grid-layout

      # The build only reads Turso; record-deploy below is the only writer.
      - name: Build blog
        run: |
          if [ -z "$TURSO_AUTH_TOKEN" ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "::notice::Read-only Turso token unavailable (fork PR?); skipping blog build"
            exit 0
          fi
          npm run build
        working-directory: apps/blog
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READ_ONLY_AUTH_TOKEN }}

      - name: Create Cloudflare Pages project (if needed)
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create maneki-blog --production-branch=main

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=maneki-blog --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
          workingDirectory: apps/blog

      - name: Record deploy
        if: github.event_name != 'pull_request'
        run: npx tsx scripts/record-deploy.ts success
        working-directory: apps/blog
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DEPLOY_ID: ${{ github.event.client_payload.deploy_id }}

      - name: Record failed deploy
        if: github.event_name != 'pull_request' && (failure() || cancelled())
        run: npx tsx scripts/record-deploy.ts failure
        working-directory: apps/blog
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DEPLOY_ID: ${{ github.event.client_payload.deploy_id }}
