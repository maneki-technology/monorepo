name: Blog Test

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/blog/**"
      - "packages/**"
      - "shared/**"
      - ".moon/**"
      - ".prototools"
      - ".github/workflows/blog-test.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "apps/blog/**"
      - "packages/**"
      - "shared/**"
      - ".moon/**"
      - ".prototools"
      - ".github/workflows/blog-test.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  blog-browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TURSO_URL: ${{ secrets.TURSO_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READ_ONLY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: npm ci
      - name: Require read-only Turso credentials
        run: test -n "$TURSO_URL" && test -n "$TURSO_AUTH_TOKEN"
      - run: moon run blog:build
      - run: npx playwright install --with-deps chromium
      - name: Blog browser tests
        run: npx playwright test
        working-directory: apps/blog
