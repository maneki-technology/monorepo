name: Test

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "shared/**"
      - ".moon/**"
      - ".prototools"
      - ".github/workflows/test.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "shared/**"
      - ".moon/**"
      - ".prototools"
      - ".github/workflows/test.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      TURSO_URL: ${{ secrets.TURSO_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READ_ONLY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: npm ci
      - name: Require read-only Turso credentials
        run: test -n "$TURSO_URL" && test -n "$TURSO_AUTH_TOKEN"
      - name: Build, test, and type-check
        run: moon run :build :test blog:typecheck

  browser:
    needs: unit
    runs-on: ubuntu-latest
    env:
      TURSO_URL: ${{ secrets.TURSO_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READ_ONLY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: npm ci
      - run: moon run catalog:build blog:build
      - run: npx playwright install --with-deps chromium
      - name: Catalog visual and accessibility tests
        run: npx playwright test --project=chromium --project=mobile-chromium
        working-directory: apps/catalog
      - name: Blog browser tests
        run: npx playwright test
        working-directory: apps/blog
