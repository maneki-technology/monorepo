name: Test

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "shared/**"
      - ".moon/**"
      - ".prototools"
      - ".github/workflows/test.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "shared/**"
      - ".moon/**"
      - ".prototools"
      - ".github/workflows/test.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: npm ci
      - name: Build packages and catalog
        run: moon run foundation:build ui-components:build grid-layout:build flex-layout:build charts:build catalog:build
      - name: Test and type-check
        run: moon run :test blog:typecheck
