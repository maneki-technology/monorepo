name: Test

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "shared/**"
      - ".moon/**"
      - ".prototools"
      - ".github/workflows/test.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "shared/**"
      - ".moon/**"
      - ".prototools"
      - ".github/workflows/test.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: npm ci
      - name: Build packages and catalog
        run: moon run foundation:build ui-components:build grid-layout:build flex-layout:build charts:build catalog:build
      - name: Test and type-check
        run: moon run :test blog:typecheck

  catalog-browser:
    runs-on: ubuntu-latest
    # Snapshots are generated in this image; the bare runner renders differently
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # proto's installer unpacks .tar.xz archives; moon runs git as the container's root user
      - run: |
          apt-get update && apt-get install -y --no-install-recommends xz-utils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: npm ci
      - run: moon run catalog:build
      - name: Catalog visual and accessibility tests
        run: npx playwright test --project=chromium --project=mobile-chromium
        working-directory: apps/catalog

  blog-browser:
    needs: unit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TURSO_URL: ${{ secrets.TURSO_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READ_ONLY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: npm ci
      - name: Require read-only Turso credentials
        run: test -n "$TURSO_URL" && test -n "$TURSO_AUTH_TOKEN"
      - run: moon run blog:build
      - run: npx playwright install --with-deps chromium
      - name: Blog browser tests
        run: npx playwright test
        working-directory: apps/blog
