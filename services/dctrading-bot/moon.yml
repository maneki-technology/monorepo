$schema: 'https://moonrepo.dev/schemas/project.json'

language: system
stack: systems

tags: [trading, zig]

tasks:
  build:
    command: zig build -Doptimize=ReleaseFast
  build-linux:
    command: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux
  test:
    command: zig build test
  run:
    command: ./zig-out/bin/dctrading -
